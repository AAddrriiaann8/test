<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAI CENAT MARKET 🗿 | Local Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #00FFC2;
      --bg: #050505;
      --surface: #121212;
      --text-muted: #888888;
      --card-border: rgba(255, 255, 255, 0.08);
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    .animate-pulse-accent {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .item-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .item-card:not(.is-done):hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(0, 255, 194, 0.3);
    }

    .done-style {
      filter: grayscale(0.8) opacity(0.5);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  
  <header class="sticky top-0 z-[100] bg-[#050505]/80 backdrop-blur-xl border-b border-white/5 px-6 py-5 md:px-10">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="text-2xl md:text-3xl font-display font-black tracking-tighter text-[#00FFC2] flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
        KAI CENAT <span class="text-white">MARKET</span>🗿
      </div>
      
      <div class="hidden md:flex flex-1 justify-center max-w-xl px-12">
        <div class="relative w-full">
          <input type="text" id="searchInput" placeholder="搜尋貨品..." class="w-full bg-[#121212] border border-white/10 rounded-2xl py-3 px-12 text-sm focus:outline-none focus:border-[#00FFC2]/50 transition-all font-medium">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 opacity-40">🔍</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="handleAISummary()" id="aiBtn" class="flex items-center gap-2 bg-zinc-800 text-zinc-100 px-4 py-2 rounded-full text-xs font-semibold hover:bg-zinc-700 transition-all active:scale-95 border border-zinc-700 disabled:opacity-50">
          <span class="text-[#00FFC2]">✨</span> <span id="aiBtnText">AI 市場摘要</span>
        </button>

        <button id="openFormBtn" class="bg-[#00FFC2] text-black px-6 py-3 rounded-xl font-bold text-sm hover:scale-105 transition-all shadow-[0_0_20px_rgba(0,255,194,0.3)]">
          + 提交物件
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-12 md:px-10">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-12">
      <div>
        <h1 class="text-4xl font-display font-bold text-white mb-2 leading-tight">
          挖掘獨特貨品 <span class="text-[#00FFC2] italic">LocalStorage Edition</span>
        </h1>
        <p class="text-text-muted text-sm max-w-md">匿名交易，本地儲存。這裡的一切只存在於你的瀏覽器中。</p>
      </div>
      
      <div class="flex flex-col gap-4 min-w-[320px]">
        <div id="categoryFilter" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar"></div>
        
        <div class="flex items-center justify-between gap-4 border-t border-white/5 pt-4">
          <div class="flex gap-2" id="statusFilters">
            <button data-status="all" class="filter-btn active px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider transition-all border border-[#00FFC2] bg-[#00FFC2] text-black">全部</button>
            <button data-status="active" class="filter-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider transition-all border border-white/10 bg-[#121212] text-text-muted">在售</button>
            <button data-status="done" class="filter-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider transition-all border border-white/10 bg-[#121212] text-text-muted">已售</button>
          </div>

          <div class="flex gap-3 text-[10px] font-bold bg-black/40 px-3 py-1.5 rounded-full border border-white/5">
            <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#00FFC2] animate-pulse-accent"></span><span id="activeCount" class="text-[#00FFC2]">0</span></div>
            <div class="flex items-center gap-1.5 border-l border-white/10 pl-3"><span class="w-1.5 h-1.5 rounded-full bg-white/20"></span><span id="doneCount" class="text-text-muted">0</span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="itemGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-text-muted">
      <div class="text-5xl mb-4">🗿</div>
      <p>這裡目前空空如也...</p>
    </div>
  </main>

  <div id="submissionModal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal()"></div>
    <div class="relative w-full max-w-lg bg-[#121212] border border-white/10 rounded-3xl p-8 shadow-2xl">
      <h2 class="text-2xl font-bold text-white mb-6">提交新物件</h2>
      <form id="recordForm" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">物件名稱</label>
            <input required type="text" id="title" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">售價 (HKD)</label>
            <input required type="number" id="price" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">分類</label>
            <select id="category" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none appearance-none">
              <option value="電子產品">電子產品</option>
              <option value="潮流服飾">潮流服飾</option>
              <option value="家居生活">家居生活</option>
              <option value="書籍">書籍</option>
              <option value="運動器材">運動器材</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">圖片網址</label>
          <input type="url" id="imageUrl" placeholder="https://..." class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">詳細描述</label>
          <textarea required rows="3" id="content" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-[#00FFC2] text-black font-bold py-4 rounded-xl hover:opacity-90 transition-all mt-4">確認提交</button>
      </form>
    </div>
  </div>

  <footer class="border-t border-white/5 py-10 px-6 text-center text-text-muted text-[10px] uppercase tracking-widest">
    <button onclick="seedInitialData()" class="mb-4 hover:text-[#00FFC2] underline decoration-[#00FFC2]/30 underline-offset-4">重置範例數據</button>
    <p>© 2026 KAI CENAT MARKET 🗿 . POWERED BY GOOGLE SHEETS & LOCALSTORAGE</p>
  </footer>

  <script>
    // ⚠️ 務必填入你從 Apps Script 「管理部署」中複製的網頁應用程式 URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIhay5qQzdhwubDZpaZVmDc_1GandsAjvBHtcZnQltXyPKCw1wFHX9jnLlShL8kXBR/exec"; 
    
    const STORAGE_KEY = "records";
    const CATEGORIES = ['全部貨品', '電子產品', '潮流服飾', '家居生活', '書籍', '運動器材'];
    
    let currentCategory = '全部貨品';
    let currentStatusFilter = 'all';
    let currentSearch = '';

    // 精準歸一化：避免發生欄位對齊失敗、未命名商品等 bug
    function normalizeRecord(r) {
      return {
        id: String(r.id || r.ID || r.Id || ""),
        createdAt: r.createdAt || r.CreatedAt || r.Createdat || new Date().toISOString(),
        title: r.title || r.Title || "未知潮流物件",
        price: Number(r.price !== undefined ? r.price : (r.Price !== undefined ? r.Price : 0)),
        category: r.category || r.Category || "其他",
        content: r.content || r.Content || "主理人很懶，沒有填寫詳細描述。",
        imageUrl: r.imageUrl || r.ImageUrl || r.Imageurl || "",
        anonId: r.anonId || r.AnonId || "#000",
        status: String(r.status || r.Status || "active").toLowerCase().trim()
      };
    }

    async function syncToSheet(payload) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) return;
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn("Cloud sync failed:", err);
      }
    }

    async function saveData(newRecord) {
      const records = loadData();
      records.push(newRecord);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      
      // ✨ 修正點 1：立刻渲染到畫面上，保證提交後物件不消失
      renderList(); 
      
      // 背景默默發送給雲端試算表
      await syncToSheet({ action: "create", record: newRecord });
    }

    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data).map(normalizeRecord) : [];
    }

    // ✨ 修正點 2：防禦型雲端資料加載
    async function fetchFromCloud() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) return;
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        
        if (data && data.error) {
          console.error("雲端後端回傳錯誤：", data.error);
          return;
        }

        // 只有在雲端確實有資料時，才覆蓋本地快取，防止洗掉剛提交的數據
        if (data && Array.isArray(data.records) && data.records.length > 0) {
          const cleanRecords = data.records.map(normalizeRecord);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanRecords));
          renderList();
        } else {
          console.log("雲端目前全空，保留本地快取運作。");
        }
      } catch (err) {
        console.warn("無法連接雲端，維持本地模式運行:", err);
      }
    }

    function renderList() {
      const records = loadData();
      const grid = document.getElementById('itemGrid');
      const empty = document.getElementById('emptyState');
      if (!grid) return;
      
      let filtered = records.filter(r => {
        const matchesSearch = r.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                              r.content.toLowerCase().includes(currentSearch.toLowerCase());
        const matchesCat = currentCategory === '全部貨品' || r.category === currentCategory;
        const matchesStatus = currentStatusFilter === 'all' || r.status === currentStatusFilter;
        return matchesSearch && matchesCat && matchesStatus;
      });

      filtered.sort((a, b) => {
        if (a.status === b.status) return new Date(b.createdAt) - new Date(a.createdAt);
        return a.status === 'active' ? -1 : 1;
      });

      document.getElementById('activeCount').innerText = records.filter(r => r.status === 'active').length;
      document.getElementById('doneCount').innerText = records.filter(r => r.status === 'done').length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        if (empty) empty.classList.remove('hidden');
        return;
      }

      if (empty) empty.classList.add('hidden');
      grid.innerHTML = filtered.map(item => `
        <div class="item-card bg-[#121212] border border-white/5 rounded-2xl p-4 flex flex-col relative group ${item.status === 'done' ? 'done-style' : ''}">
          <div class="absolute top-4 right-4 z-10 flex gap-2">
            <button onclick="toggleStatus('${item.id}')" class="text-[9px] px-2 py-1 rounded-full border font-bold uppercase transition-all ${item.status === 'done' ? 'bg-white/5 text-white/40 border-white/10' : 'bg-[#00FFC2]/10 text-[#00FFC2] border-[#00FFC2]/20 hover:bg-[#00FFC2] hover:text-black'}">
              ${item.status === 'done' ? '已售出 🗿' : '在售中'}
            </button>
            <div class="text-[9px] bg-black/60 px-2 py-1 rounded-full text-text-muted border border-white/5 font-bold">${item.anonId}</div>
          </div>
          
          <div class="w-full h-40 bg-zinc-900 rounded-xl mb-4 overflow-hidden">
            <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'}" class="w-full h-full object-cover">
          </div>

          <div class="text-[10px] uppercase text-[#00FFC2] tracking-[0.2em] font-black mb-1 font-display">${item.category}</div>
          <h3 class="text-lg font-display font-bold text-white mb-1 truncate">${item.title}</h3>
          <p class="text-xs text-text-muted line-clamp-2 mb-6 h-8">${item.content}</p>

          <div class="mt-auto pt-4 border-t border-white/5 flex justify-between items-end">
            <div>
              <span class="text-[9px] uppercase font-bold text-text-muted block">Price</span>
              <div class="text-xl font-display font-black text-white">HKD $${item.price}</div>
            </div>
            <button onclick="deleteRecord('${item.id}')" class="text-white/10 hover:text-red-500 transition-colors text-[10px] mb-1">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function toggleStatus(id) {
      const records = loadData();
      const idx = records.findIndex(r => r.id === id);
      if (idx > -1) {
        const newStatus = records[idx].status === 'active' ? 'done' : 'active';
        records[idx].status = newStatus;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        renderList();
        syncToSheet({ action: "update", id: id, changes: { status: newStatus } });
      }
    }

    function deleteRecord(id) {
      if (!confirm('確認從市場下架並刪除此項目？')) return;
      const records = loadData().filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderList();
      syncToSheet({ action: "delete", id: id });
    }

    function toggleModal() {
      document.getElementById('submissionModal').classList.toggle('hidden');
    }

    // --- AI 市場摘要請求引擎 ---
    async function handleAISummary() {
      const btn = document.getElementById('aiBtn');
      const text = document.getElementById('aiBtnText');
      if (!btn || !text) return;

      const records = loadData().filter(r => r.status === 'active');
      if (records.length === 0) {
        alert('現時市場上沒有在售商品，請先點擊下方「重置範例數據」或手動提交物件 🗿');
        return;
      }

      btn.disabled = true;
      text.textContent = '分析中...';

      try {
        const marketSnapshot = records.slice(0, 20).map(r => 
          `- [${r.category}] 商品名稱:${r.title} | 售價:HKD $${r.price} | 詳情:${r.content}`
        ).join('\n');

        const aiPrompt = "你現在是 KAI CENAT MARKET 的美式潮流主理人。請根據以下架上在售商品清單，使用繁體中文（帶有街頭酷炫幽默、多用潮流口吻如 '🗿', 'No Cap', 'W'），用 3 至 4 句短文為用戶總結出當前的熱門商品趨勢、好物推薦以及市場氣氛：\n\n" + marketSnapshot;

        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "askAI", prompt: aiPrompt })
        });
        
        const data = await response.json();
        if (data.result) {
          alert(data.result);
        } else {
          alert("AI 報告生成失敗：" + (data.error || "後端返回未知錯誤"));
        }
      } catch (e) {
        alert("無法連接到 AI 後端: " + e.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'AI 市場摘要';
      }
    }

    // --- 初始化 UI 綁定 ---
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('openFormBtn').onclick = toggleModal;

      document.getElementById('recordForm').onsubmit = (e) => {
        e.preventDefault();
        const newRecord = {
          id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
          createdAt: new Date().toISOString(),
          title: document.getElementById('title').value,
          price: Number(document.getElementById('price').value),
          category: document.getElementById('category').value,
          content: document.getElementById('content').value,
          imageUrl: document.getElementById('imageUrl').value,
          anonId: "#" + Math.floor(Math.random() * 900 + 100),
          status: "active"
        };

        saveData(newRecord);
        e.target.reset();
        toggleModal();
      };

      document.getElementById('searchInput').oninput = (e) => {
        currentSearch = e.target.value;
        renderList();
      };

      const filterContainer = document.getElementById('categoryFilter');
      filterContainer.innerHTML = CATEGORIES.map(cat => `
        <button class="cat-btn whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold border transition-all ${cat === currentCategory ? 'bg-[#00FFC2]/10 text-[#00FFC2] border-[#00FFC2]' : 'bg-[#121212] text-text-muted border-white/10 hover:border-white/30'}" data-cat="${cat}">
          ${cat}
        </button>
      `).join('');

      filterContainer.onclick = (e) => {
        if (e.target.dataset.cat) {
          currentCategory = e.target.dataset.cat;
          document.querySelectorAll('.cat-btn').forEach(b => {
            if (b.dataset.cat === currentCategory) {
              b.className = "cat-btn whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold border transition-all bg-[#00FFC2]/10 text-[#00FFC2] border-[#00FFC2]";
            } else {
              b.className = "cat-btn whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold border transition-all bg-[#121212] text-text-muted border-white/10 hover:border-white/30";
            }
          });
          renderList();
        }
      };

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          currentStatusFilter = btn.dataset.status;
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active', 'bg-[#00FFC2]', 'text-black', 'border-[#00FFC2]');
            b.classList.add('bg-[#121212]', 'text-text-muted', 'border-white/10');
          });
          btn.classList.add('active', 'bg-[#00FFC2]', 'text-black', 'border-[#00FFC2]');
          btn.classList.remove('bg-[#121212]', 'text-text-muted', 'border-white/10');
          renderList();
        };
      });

      renderList();
      fetchFromCloud();
    });

    function seedInitialData() {
      if (confirm('重置將清除所有本地紀錄並加入初代潮流商品範例。繼續？')) {
        const samples = [
          {
            id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
            createdAt: new Date().toISOString(),
            title: "復古底片相機 95%新",
            price: 850,
            category: "電子產品",
            content: "經典型號，快門清脆，附送兩卷底片。",
            imageUrl: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400",
            anonId: "#342",
            status: "active"
          },
          {
            id: (Date.now()+1) + "_" + Math.random().toString(36).slice(2,6),
            createdAt: new Date().toISOString(),
            title: "Kai 同款限定潮流冷帽",
            price: 299,
            category: "潮流服飾",
            content: "激罕街頭配色，保暖百搭，直播出鏡率極高。",
            imageUrl: "https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?w=400",
            anonId: "#881",
            status: "active"
          }
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(samples));
        renderList();
        samples.forEach(s => syncToSheet({ action: "create", record: s }));
      }
    }
  </script>
</body>
</html>
