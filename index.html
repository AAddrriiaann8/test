<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAI CENAT MARKET 🗿 | Local Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --accent: #00FFC2;
      --bg: #050505;
      --surface: #121212;
      --text-muted: #888888;
      --card-border: rgba(255, 255, 255, 0.08);
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    .animate-pulse-accent {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .item-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .item-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(0, 255, 194, 0.3);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  
  <header class="sticky top-0 z-[100] bg-[#050505]/80 backdrop-blur-xl border-b border-white/5 px-6 py-5 md:px-10">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="text-2xl md:text-3xl font-display font-black tracking-tighter text-[#00FFC2] flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
        KAI CENAT <span class="text-white">MARKET</span>🗿
      </div>
      
      <div class="hidden md:flex flex-1 justify-center max-w-xl px-12">
        <div class="relative w-full">
          <input type="text" id="searchInput" placeholder="搜尋商品名稱或敘述..." class="w-full bg-[#121212] border border-white/10 rounded-2xl py-3 px-12 text-sm focus:outline-none focus:border-[#00FFC2]/50 transition-all font-medium">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 opacity-40">🔍</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="handleAISummary()" id="aiBtn" class="flex items-center gap-2 bg-zinc-800 text-zinc-100 px-4 py-2 rounded-full font-medium hover:bg-zinc-700 transition-colors active:scale-95 border border-zinc-700 disabled:opacity-50">
          <i data-lucide="sparkles" class="w-4 h-4 text-[#00FFC2]"></i>
          <span id="aiBtnText">AI 市場分析</span>
        </button>

        <button id="openFormBtn" onclick="toggleModal()" class="bg-[#00FFC2] text-black px-6 py-3 rounded-xl font-bold text-sm hover:scale-105 transition-all shadow-[0_0_20px_rgba(0,255,194,0.3)]">
          + 上架新商品
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-12 md:px-10">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-12">
      <div>
        <h1 class="text-4xl font-display font-bold text-white mb-2 leading-tight">
          探索頂級潮流交易 <span class="text-[#00FFC2] italic">LocalStorage Edition</span>
        </h1>
        <p class="text-text-muted text-sm max-w-md">匿名交易，雲端同步。在這裡自由買賣你想要的 KAI 風格商品。</p>
      </div>
      
      <div class="flex flex-col gap-4 min-w-[320px]">
        <div id="categoryFilter" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar"></div>
        
        <div class="flex items-center justify-between gap-4 border-t border-white/5 pt-4">
          <div class="flex gap-2" id="statusFilters">
            <button onclick="setFilter('all')" data-status="all" class="filter-btn active px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider transition-all border border-[#00FFC2] bg-[#00FFC2] text-black">全部商品</button>
            <button onclick="setFilter('active')" data-status="active" class="filter-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider transition-all border border-white/10 bg-[#121212] text-text-muted">現貨供應</button>
          </div>

          <div class="flex gap-3 text-[10px] font-bold bg-black/40 px-3 py-1.5 rounded-full border border-white/5">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#00FFC2] animate-pulse-accent"></span>
              <span>總架上商品：<span id="activeCount" class="text-[#00FFC2]">0</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="itemGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-text-muted">
      <div class="text-5xl mb-4">🗿</div>
      <p>目前市場上沒有任何商品...</p>
    </div>
  </main>

  <div id="submissionModal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal()"></div>
    <div class="relative w-full max-w-lg bg-[#121212] border border-white/10 rounded-3xl p-8 shadow-2xl">
      <h2 class="text-2xl font-bold text-white mb-6">上架全新商品</h2>
      <form id="recordForm" class="space-y-4">
        <div>
          <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">商品分類</label>
          <select id="category" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none appearance-none">
            <option value="電子產品">電子產品</option>
            <option value="潮流服飾">潮流服飾</option>
            <option value="家居生活">家居生活</option>
            <option value="虛擬寶物">虛擬寶物</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-text-muted uppercase mb-2">商品規格 / 詳細描述</label>
          <textarea required rows="4" id="content" placeholder="請輸入商品名稱、細節與價錢..." class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm text-white focus:border-[#00FFC2]/50 outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-[#00FFC2] text-black font-bold py-4 rounded-xl hover:opacity-90 transition-all mt-4">確認上架到市場</button>
      </form>
    </div>
  </div>

  <footer class="border-t border-white/5 py-10 px-6 text-center text-text-muted text-[10px] uppercase tracking-widest">
    <p>© 2026 KAI CENAT MARKET 🗿 . ALL RIGHTS RESERVED.</p>
  </footer>

  <script>
    // 保留原本完全一致的 URL 
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIhay5qQzdhwubDZpaZVmDc_1GandsAjvBHtcZnQltXyPKCw1wFHX9jnLlShL8kXBR/exec";
    
    const STORAGE_KEY = "records";
    const CATEGORIES = ['全部', '電子產品', '潮流服飾', '家居生活', '虛擬寶物', '其他'];
    
    let currentCategory = '全部';
    let currentStatusFilter = 'all';
    let currentSearch = '';

    // --- 同步核心背景傳輸功能 ---
    async function syncToSheet(payload) {
      if (!APPS_SCRIPT_URL) return;
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn("Cloud sync failed:", err);
      }
    }

    // --- 大細階與 Likes 的強效歸一化防禦機制 ---
    function normalizeRecord(record) {
      let rawLikes = record.likes !== undefined ? record.likes : record.Likes;
      let cleanLikes = Number(rawLikes);
      if (isNaN(cleanLikes)) {
        cleanLikes = 0; // 絕不允許出現 undefined 或 NaN
      }
      
      return {
        id: record.id || record.ID || "",
        createdAt: record.createdAt || record.CreatedAt || "",
        content: record.content || record.Content || "",
        category: record.category || record.Category || "其他",
        likes: cleanLikes,
        status: record.status || record.Status || "active"
      };
    }

    async function fetchRecordsFromSheet() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        return Array.isArray(data.records) ? data.records.map(normalizeRecord) : null;
      } catch (e) {
        console.warn("無法連接後端，啟動本地儲存防護網", e);
        return null;
      }
    }

    // --- 從本地與雲端載入資料 ---
    async function loadData() {
      const remote = await fetchRecordsFromSheet();
      if (remote) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
        return remote;
      }
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    // --- 渲染市場商品清單 ---
    async function renderList(recordsOverride) {
      // 安全閥：如果找不到對應元件，代表網格未加載，直接跳出防止 Crash
      const grid = document.getElementById('itemGrid');
      if (!grid) return;
      
      const empty = document.getElementById('emptyState');
      const records = recordsOverride || await loadData();
      
      let filtered = records.filter(r => {
        const matchesSearch = r.content.toLowerCase().includes(currentSearch.toLowerCase()) || 
                              r.category.toLowerCase().includes(currentSearch.toLowerCase());
        const matchesCat = currentCategory === '全部' || r.category === currentCategory;
        const matchesStatus = currentStatusFilter === 'all' || r.status === currentStatusFilter;
        return matchesSearch && matchesCat && matchesStatus;
      });

      filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const activeCountEl = document.getElementById('activeCount');
      if (activeCountEl) {
        activeCountEl.innerText = records.filter(r => r.status === 'active').length;
      }

      if (filtered.length === 0) {
        grid.innerHTML = '';
        if (empty) empty.classList.remove('hidden');
        return;
      }

      if (empty) empty.classList.add('hidden');
      grid.innerHTML = filtered.map(item => createCard(item)).join('');
      
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function createCard(item) {
      return `
        <div class="item-card bg-[#121212] border border-white/5 rounded-2xl p-5 flex flex-col relative group">
          <div class="text-[10px] uppercase text-[#00FFC2] tracking-[0.2em] font-black mb-2 font-display">${item.category}</div>
          <p class="text-sm text-white/90 leading-relaxed mb-6 flex-1 whitespace-pre-wrap">${item.content}</p>

          <div class="mt-auto pt-4 border-t border-white/5 flex justify-between items-center">
            <button onclick="handleLike('${item.id}')" class="flex items-center gap-2 text-xs font-bold text-text-muted hover:text-[#00FFC2] transition-colors bg-white/5 px-3 py-1.5 rounded-full border border-white/5 group/like">
              <i data-lucide="heart" class="w-3.5 h-3.5 text-red-500 fill-red-500 transition-transform group-hover/like:scale-110"></i>
              <span>${item.likes}</span>
            </button>
            <span class="text-[9px] text-text-muted">${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : ''}</span>
          </div>
        </div>
      `;
    }

    // --- 本機優先即時上架商品 ---
    async function saveData(newRecord) {
      const records = await loadData();
      records.push(newRecord);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      syncToSheet({ action: "create", record: newRecord });
      await renderList(records);
    }

    // --- 點讚意向度更新 ---
    async function handleLike(id) {
      const records = await loadData();
      const index = records.findIndex(r => r.id === id);
      if (index !== -1) {
        records[index].likes = (records[index].likes || 0) + 1;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        syncToSheet({ action: "update", id: id, changes: { likes: records[index].likes } });
        await renderList(records);
      }
    }

    // --- 狀態篩選與過濾 ---
    async function setFilter(status) {
      currentStatusFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active', 'bg-[#00FFC2]', 'text-black', 'border-[#00FFC2]');
        b.classList.add('bg-[#121212]', 'text-text-muted', 'border-white/10');
      });
      const activeBtn = document.querySelector(`[data-status="${status}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active', 'bg-[#00FFC2]', 'text-black', 'border-[#00FFC2]');
        activeBtn.classList.remove('bg-[#121212]', 'text-text-muted', 'border-white/10');
      }
      await renderList();
    }

    async function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        if (b.dataset.cat === currentCategory) {
          b.className = "cat-btn whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold border transition-all bg-[#00FFC2]/10 text-[#00FFC2] border-[#00FFC2]";
        } else {
          b.className = "cat-btn whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold border transition-all bg-[#121212] text-text-muted border-white/10 hover:border-white/30";
        }
      });
      await renderList();
    }

    function toggleModal() {
      const modal = document.getElementById('submissionModal');
      if (modal) modal.classList.toggle('hidden');
    }

    // --- AI 市場對話請求 ---
    async function askAI(userPrompt) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "askAI", prompt: userPrompt })
      });
      const data = await res.json();
      return data.result || data.error || "AI 暫時未能提供分析報告";
    }

    async function handleAISummary() {
      const btn = document.getElementById('aiBtn');
      const text = document.getElementById('aiBtnText');
      if (!btn || !text) return;

      btn.disabled = true;
      text.textContent = '分析中...';
      try {
        const records = await loadData();
        if (records.length === 0) { alert('現時市場未有足夠商品進行分析數據'); return; }
        
        const marketInput = records.slice(0, 30).map(r =>
          `[${r.category}] ${r.content} (關注度: ${r.likes}❤️)`
        ).join('\n');
        
        const prompt = '以下是 KAI CENAT MARKET 的商品架上清單。請以專業且帶點幽默美式潮流的口吻（使用繁體中文），用 3-4 句為買家生成一份簡短的市場熱度與熱門商品趨勢分析報告:\n\n' + marketInput;
        
        const result = await askAI(prompt);
        alert(result);
      } catch (e) {
        alert('AI 分析出錯：' + e.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'AI 市場分析';
      }
    }

    // 介面初始化
    document.addEventListener("DOMContentLoaded", async () => {
      // 綁定表單
      const form = document.getElementById('recordForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const newRecord = {
            id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
            createdAt: new Date().toISOString(),
            content: document.getElementById('content').value,
            category: document.getElementById('category').value,
            likes: 0,
            status: "active"
          };
          await saveData(newRecord);
          e.target.reset();
          toggleModal();
        };
      }

      // 綁定搜尋輸入
      const search = document.getElementById('searchInput');
      if (search) {
        search.oninput = async (e) => {
          currentSearch = e.target.value;
          await renderList();
        };
      }

      // 渲染動態分類按鈕
      const filterContainer = document.getElementById('categoryFilter');
      if (filterContainer) {
        filterContainer.innerHTML = CATEGORIES.map(cat => `
          <button class="cat-btn whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-bold border transition-all ${cat === currentCategory ? 'bg-[#00FFC2]/10 text-[#00FFC2] border-[#00FFC2]' : 'bg-[#121212] text-text-muted border-white/10 hover:border-white/30'}" data-cat="${cat}" onclick="selectCategory('${cat}')">
            ${cat}
          </button>
        `).join('');
      }

      // 執行首次資料渲染
      await renderList();
    });
  </script>
</body>
</html>
